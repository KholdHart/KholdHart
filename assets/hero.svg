<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="KholdHart — Agentic Automation Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070D"/><stop offset="1" stop-color="#0B1124"/>
  </linearGradient>
  <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
    <stop offset="0" stop-color="#7DF9FF"/>
    <stop offset="0.25" stop-color="#FFFFFF"/>
    <stop offset="0.5" stop-color="#4C8DFF"/>
    <stop offset="0.75" stop-color="#FF3D6E"/>
    <stop offset="1" stop-color="#7DF9FF"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;0 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="spread" gradientUnits="userSpaceOnUse" x1="-1200" y1="0" x2="0" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#7DF9FF"/><stop offset="0.5" stop-color="#FF3D6E"/><stop offset="1" stop-color="#7DF9FF"/>
  </linearGradient>
  <linearGradient id="ecg" x1="0" x2="1">
    <stop offset="0" stop-color="#FF3D6E" stop-opacity="0"/>
    <stop offset="0.3" stop-color="#FF3D6E"/>
    <stop offset="0.7" stop-color="#7DF9FF"/>
    <stop offset="1" stop-color="#7DF9FF" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
  </pattern>
  <clipPath id="clip"><rect width="1200" height="460" rx="28"/></clipPath>
  <style>
    .tw { animation: tw ease-in-out infinite; opacity:.2 }
    @keyframes tw { 0%,100% {opacity:.15} 50% {opacity:.95} }
    .b1 { animation: d1 14s ease-in-out infinite alternate }
    .b2 { animation: d2 18s ease-in-out infinite alternate }
    .b3 { animation: d3 16s ease-in-out infinite alternate }
    @keyframes d1 { to { transform: translate(260px, 60px) } }
    @keyframes d2 { to { transform: translate(-300px, -40px) } }
    @keyframes d3 { to { transform: translate(120px, -90px) } }
    .role { font: 600 26px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; fill:#7DF9FF; opacity:0; animation: role 15.0s infinite }
    @keyframes role {
      0% {opacity:0; transform: translateY(10px)}
      2.40% {opacity:1; transform: translateY(0)}
      17.00% {opacity:1; transform: translateY(0)}
      20.00% {opacity:0; transform: translateY(-10px)}
      100% {opacity:0}
    }
    .cur { animation: blink 1s steps(1) infinite }
    @keyframes blink { 50% { opacity:0 } }
    .pulse { animation: pulse 1.6s ease-out infinite; transform-origin: 1003px 46px }
    @keyframes pulse { 0% { transform: scale(1); opacity:.9 } 100% { transform: scale(3.2); opacity:0 } }
    .ecg { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: beat 2.6s linear infinite }
    @keyframes beat { 0% {stroke-dashoffset:1400} 70% {stroke-dashoffset:0} 100% {stroke-dashoffset:-1400} }
    .scan { animation: scan 7s linear infinite }
    @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(500px) } }
  </style>
</defs>
